<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Teleprompter">
<title>Teleprompter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;height:100%;overflow:hidden}button,textarea,input,select{font:inherit}.app{position:fixed;inset:0;background:#050505}.camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}.mirror{transform:scaleX(-1)}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.38),transparent 18%,transparent 72%,rgba(0,0,0,.68));pointer-events:none}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;z-index:6}.pill{border:1px solid #ffffff30;background:#111b;color:#fff;border-radius:999px;padding:10px 14px;backdrop-filter:blur(15px)}.rec{display:none;background:#c92020}.rec.on{display:block}.promptWrap{position:absolute;left:7%;right:7%;top:18%;height:46%;overflow:hidden;z-index:4;mask-image:linear-gradient(transparent,#000 14%,#000 82%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 82%,transparent)}.prompt{position:absolute;width:100%;top:42%;font-size:36px;font-weight:700;line-height:1.2;text-align:center;text-shadow:0 2px 8px #000,0 0 20px #000;white-space:pre-wrap}.guide{position:absolute;left:0;right:0;top:48%;height:2px;background:#fff2;z-index:3}.controls{position:absolute;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));left:14px;right:14px;z-index:7;display:flex;align-items:center;justify-content:space-around}.circle{width:54px;height:54px;border-radius:50%;border:1px solid #ffffff2c;background:#111c;color:#fff;font-size:22px;backdrop-filter:blur(15px)}.record{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:transparent;padding:7px}.record:after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:#e22}.record.stop:after{border-radius:10px;transform:scale(.58)}.panel{position:absolute;z-index:10;left:0;right:0;bottom:0;background:#111;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.25s;max-height:72vh;overflow:auto}.panel.open{transform:translateY(0)}.panel h2{margin:0 0 14px}.panel textarea{width:100%;min-height:180px;border:1px solid #333;border-radius:14px;background:#1c1c1e;color:#fff;padding:14px;resize:vertical}.row{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;margin:15px 0}.row input{width:100%}.close,.primary{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700}.primary{background:#fff;color:#000}.close{margin-top:8px;background:#29292c;color:#fff}.count{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:#0005;font-size:120px;font-weight:800}.count.on{display:grid}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px;z-index:2}.empty button{border:0;border-radius:15px;padding:15px 20px;font-weight:700}.review{position:absolute;inset:0;background:#050505;z-index:30;display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));gap:12px}.review.on{display:flex}.review video{width:100%;flex:1;min-height:0;object-fit:contain;border-radius:18px;background:#000}.reviewActions{display:flex;gap:10px}.reviewActions button{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700}.hint{font-size:12px;opacity:.7;text-align:center}@media(max-width:380px){.prompt{font-size:31px}.circle{width:48px;height:48px}}
</style></head>
<body><main class="app">
<video id="cam" class="camera mirror" autoplay playsinline muted></video><div class="shade"></div><div class="guide"></div>
<div class="empty" id="empty"><div><h2>Teleprompter</h2><p>Activa la cámara y empieza a grabar leyendo tu guion.</p><button onclick="startCamera()">Activar cámara</button></div></div>
<div class="top"><button class="pill" onclick="togglePanel()">✎ Guion</button><div id="recBadge" class="pill rec">● <span id="timer">00:00</span></div><button class="pill" onclick="togglePanel()">⚙︎</button></div>
<div class="promptWrap" id="promptWrap"><div id="prompt" class="prompt">Escribe aquí tu guion.\n\nHabla mirando cerca de la cámara y deja que el texto avance automáticamente.</div></div>
<div class="controls"><button class="circle" onclick="resetScroll()">↺</button><button class="circle" id="play" onclick="toggleScroll()">▶</button><button class="record" id="record" onclick="recordToggle()" aria-label="Grabar"></button><button class="circle" onclick="switchCamera()">⇄</button><button class="circle" onclick="toggleMirror()">↔</button></div>
<div class="count" id="count">3</div>
<section class="panel" id="panel"><h2>Guion y ajustes</h2><textarea id="script">Escribe aquí tu guion.\n\nHabla mirando cerca de la cámara y deja que el texto avance automáticamente.</textarea>
<div class="row"><label>Velocidad</label><input id="speed" type="range" min="10" max="160" value="48"><span id="speedV">48</span></div>
<div class="row"><label>Texto</label><input id="font" type="range" min="24" max="64" value="36"><span id="fontV">36</span></div>
<div class="row"><label>Posición</label><input id="pos" type="range" min="8" max="45" value="18"><span id="posV">18</span></div>
<div class="row"><label>Cuenta atrás</label><select id="delay"><option value="0">0 s</option><option value="3" selected>3 s</option><option value="5">5 s</option><option value="10">10 s</option></select><span></span></div>
<button class="primary" onclick="applySettings();togglePanel()">Aplicar</button><button class="close" onclick="togglePanel()">Cerrar</button></section>
<section class="review" id="review"><video id="playback" controls playsinline></video><div class="reviewActions"><button onclick="discard()">Repetir</button><button onclick="shareVideo()">Guardar / compartir</button></div><div class="hint">En iPhone, usa “Guardar vídeo” en la hoja de compartir.</div></section>
</main><script>
let stream,recorder,chunks=[],facing='user',mirrored=true,scrolling=false,raf,last=0,offset=0,recordStart=0,timerInt,videoBlob;
const $=id=>document.getElementById(id),cam=$('cam'),prompt=$('prompt'),wrap=$('promptWrap');
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1080},height:{ideal:1920}},audio:true});cam.srcObject=stream;$('empty').style.display='none';}catch(e){alert('Necesito permiso para usar la cámara y el micrófono. Revisa los permisos de Safari.')}}
function togglePanel(){$('panel').classList.toggle('open')}
function applySettings(){prompt.textContent=$('script').value;prompt.style.fontSize=$('font').value+'px';wrap.style.top=$('pos').value+'%';resetScroll()}
['speed','font','pos'].forEach(id=>$(id).oninput=()=>$(id+'V').textContent=$(id).value);
function step(t){if(!scrolling)return;if(!last)last=t;offset+=(t-last)/1000*+$('speed').value;last=t;prompt.style.transform=`translateY(-${offset}px)`;raf=requestAnimationFrame(step)}
function toggleScroll(){scrolling=!scrolling;$('play').textContent=scrolling?'Ⅱ':'▶';last=0;if(scrolling)raf=requestAnimationFrame(step);else cancelAnimationFrame(raf)}
function resetScroll(){scrolling=false;cancelAnimationFrame(raf);offset=0;last=0;prompt.style.transform='translateY(0)';$('play').textContent='▶'}
async function switchCamera(){facing=facing==='user'?'environment':'user';mirrored=facing==='user';cam.classList.toggle('mirror',mirrored);await startCamera()}
function toggleMirror(){mirrored=!mirrored;cam.classList.toggle('mirror',mirrored)}
async function countdown(){let n=+$('delay').value;if(!n)return;const c=$('count');c.classList.add('on');while(n>0){c.textContent=n;await new Promise(r=>setTimeout(r,1000));n--}c.classList.remove('on')}
function mime(){const a=['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp8,opus','video/webm'];return a.find(x=>MediaRecorder.isTypeSupported(x))||''}
async function recordToggle(){if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!stream)await startCamera();await countdown();chunks=[];const m=mime();try{recorder=new MediaRecorder(stream,m?{mimeType:m}:undefined)}catch(e){recorder=new MediaRecorder(stream)}recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=finishRecording;recorder.start(250);recordStart=Date.now();$('record').classList.add('stop');$('recBadge').classList.add('on');timerInt=setInterval(updateTimer,250);if(!scrolling)toggleScroll()}
function updateTimer(){const s=Math.floor((Date.now()-recordStart)/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function finishRecording(){clearInterval(timerInt);$('record').classList.remove('stop');$('recBadge').classList.remove('on');if(scrolling)toggleScroll();videoBlob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});$('playback').src=URL.createObjectURL(videoBlob);$('review').classList.add('on')}
function discard(){$('review').classList.remove('on');$('playback').pause();resetScroll()}
async function shareVideo(){if(!videoBlob)return;const ext=videoBlob.type.includes('mp4')?'mp4':'webm',file=new File([videoBlob],`teleprompter-${Date.now()}.${ext}`,{type:videoBlob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Vídeo Teleprompter'});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(videoBlob);a.download=file.name;a.click()}
applySettings();
</script></body></html>
