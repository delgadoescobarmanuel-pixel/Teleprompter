<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Teleprompter"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Teleprompter</title><style>:root{color-scheme:dark;--g:#e0b44e}*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea,input,select{font:inherit}.stage{position:relative;height:55dvh;min-height:460px;overflow:hidden;background:#000}.recordingMode .stage{height:100dvh;min-height:100dvh}.recordingMode .panel{display:none}.preview{width:100%;height:100%;object-fit:cover}.recordingMode .preview{object-fit:contain}.mirror{transform:scaleX(-1)}.shade{position:absolute;inset:0;background:linear-gradient(#0009,transparent 22%,transparent 68%,#000b);pointer-events:none}.top{position:absolute;z-index:20;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;display:flex;justify-content:space-between}.topRight{display:flex;gap:5px}.pill{height:40px;border:1px solid #ffffff35;border-radius:22px;padding:0 10px;background:#151515cc;color:#fff;font-weight:700;font-size:12px}.active{border-color:var(--g)}.badge{display:none;position:absolute;z-index:30;top:calc(env(safe-area-inset-top) + 56px);left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:20px;background:#111d;font-weight:800}.badge.on{display:block}.shell{position:absolute;z-index:10;left:5%;right:5%;top:22%;bottom:25%;overflow:hidden;pointer-events:none}.guide{position:absolute;left:0;right:0;height:74px;border-top:1px solid #ffffff24;border-bottom:1px solid #ffffff24}.prompt{position:absolute;left:0;right:0;padding:0 8px 300px;text-align:center;font-weight:750;line-height:1.22;white-space:pre-wrap;text-shadow:0 2px 10px #000}.bottom{position:absolute;z-index:25;bottom:10px;left:10px;right:10px;display:flex;align-items:center;justify-content:center;gap:10px}.round{width:48px;height:48px;border:1px solid #ffffff35;border-radius:50%;background:#151515d9;color:#fff;font-weight:700}.rec{width:68px;height:68px;border:5px solid #fff;border-radius:50%;background:#ff4545}.rec.stop{width:58px;height:58px;border-radius:17px}.pauseBtn{display:none;width:92px;border-radius:24px;font-size:13px}.pauseBtn.on{display:block}.count{display:none;position:absolute;z-index:50;inset:0;place-items:center;background:#0007;font-size:100px;font-weight:900}.count.on{display:grid}.panel{display:flex;flex-direction:column;padding:16px 14px 30px;background:#0b0b0b}.panel h1{font-size:18px;margin:0 0 10px}.script,.libText{width:100%;border:1px solid #303030;border-radius:14px;background:#171717;color:#fff;padding:13px;font-size:17px;line-height:1.4;resize:vertical}.script{min-height:120px}.library{margin-bottom:14px;padding:14px;border:1px solid #2a2a2a;border-radius:16px;background:#121212}.libraryTop{display:grid;grid-template-columns:1fr;gap:9px}.libraryTop select,.libraryTop input{min-height:44px;border:1px solid #333;border-radius:12px;background:#181818;color:#fff;padding:0 10px}.libText{min-height:170px}.libActions{display:flex;gap:8px}.small{min-height:44px;border:1px solid #444;border-radius:12px;background:#242424;color:#fff;padding:0 12px;font-weight:700}.small.gold{background:var(--g);color:#111;border-color:var(--g);flex:1}.savedList{display:grid;gap:8px;margin-top:12px}.savedItem{display:flex;gap:8px;padding:10px;border:1px solid #292929;border-radius:12px;background:#191919;align-items:center}.savedMain{min-width:0;flex:1}.savedTitle{font-weight:800}.savedMeta{color:#999;font-size:12px}.savedItem button{border:0;border-radius:10px;padding:9px;background:#2a2a2a;color:#fff}.emptyLib{color:#8f8f8f;font-size:13px;padding:8px}.grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}.control{padding:11px;border:1px solid #292929;border-radius:15px;background:#171717}.label{display:flex;justify-content:space-between;color:#bbb;font-size:13px;margin-bottom:8px}.control input,.control select{width:100%;accent-color:var(--g)}.actions{display:flex;gap:10px;margin-top:12px}.action{flex:1;min-height:48px;border:1px solid #333;border-radius:14px;background:#222;color:#fff;font-weight:800}.primary{background:var(--g);color:#111}.status{margin-top:10px;color:#aaa;font-size:13px}.result{display:none;order:-10;margin-bottom:16px;padding:14px;border:2px solid #3a7748;border-radius:18px;background:#102015}.result.on{display:block}.result video{width:100%;max-height:280px;border-radius:12px;background:#000;margin:8px 0}.save{width:100%;min-height:58px;border:0;border-radius:15px;background:#29c36a;color:#06180c;font-weight:900;font-size:18px}.open{display:block;margin-top:9px;padding:12px;text-align:center;border:1px solid #3a6246;border-radius:12px;color:#fff;text-decoration:none;font-weight:700}@media(max-width:430px){.prompt{font-size:30px!important}}</style></head><body><main><section class="stage"><video id="cam" class="preview mirror" autoplay playsinline muted></video><div class="shade"></div><div class="top"><button id="camera" class="pill">📷 Cámara</button><div class="topRight"><button id="flip" class="pill">↺ Girar</button><button id="mirror" class="pill active">⇄ Espejo</button></div></div><div id="badge" class="badge"><span id="state">● REC</span> <span id="timer">00:00</span></div><div id="shell" class="shell"><div id="guide" class="guide"></div><div id="prompt" class="prompt"></div></div><div id="count" class="count">3</div><div class="bottom"><button id="scroll" class="round">▶</button><button id="record" class="rec"></button><button id="pause" class="round pauseBtn">Ⅱ Pausa</button><button id="reset" class="round">↺</button></div></section><section class="panel"><div id="result" class="result"><h1>✅ Vídeo listo</h1><video id="playback" controls playsinline></video><button id="save" class="save">Guardar vídeo en iPhone</button><a id="open" class="open" target="_blank">Abrir vídeo</a></div><div class="library"><h1>📁 Mis guiones</h1><div class="libraryTop"><select id="folderSelect"></select><input id="scriptName" placeholder="Título del guion"><textarea id="libraryText" class="libText" placeholder="Escribe aquí el contenido completo del guion..."></textarea><div class="libActions"><button id="saveScript" class="small gold">Guardar guion</button><button id="newFolder" class="small">+ Carpeta</button></div></div><div id="savedList" class="savedList"></div></div><h1>Guion actual</h1><textarea id="script" class="script">¿Quieres grabar contenido sin memorizar cada frase?

Con este teleprompter puedes mirar casi directamente a cámara mientras lees.</textarea><div class="grid"><div class="control"><div class="label"><span>Velocidad</span><b id="sv">36</b></div><input id="speed" type="range" min="10" max="90" value="36"></div><div class="control"><div class="label"><span>Letra</span><b id="fv">42px</b></div><input id="font" type="range" min="24" max="56" value="42"></div><div class="control"><div class="label"><span>Posición</span><b id="pv">28%</b></div><input id="pos" type="range" min="8" max="55" value="28"></div><div class="control"><select id="delay"><option value="0">Sin cuenta atrás</option><option value="3" selected>3 segundos</option><option value="5">5 segundos</option></select></div></div><div class="actions"><button id="activate" class="action primary">Activar cámara</button></div><div id="status" class="status">Activa cámara y micrófono.</div></section></main><script>(()=>{const $=x=>document.getElementById(x),cam=$('cam'),prompt=$('prompt'),shell=$('shell'),guide=$('guide');let stream,rec,chunks=[],facing='user',mirrored=true,scrolling=false,raf,last,y=0,recording=false,paused=false,blob,url,elapsed=0,segment=0,tick;const KEY='teleprompter_library_v1';let lib={folders:['General'],scripts:[]};function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)lib=x}catch{};if(!lib.folders?.length)lib.folders=['General'];render()}function persist(){localStorage.setItem(KEY,JSON.stringify(lib));render()}function render(){let fs=$('folderSelect'),cur=fs.value;fs.innerHTML='';lib.folders.forEach(f=>fs.add(new Option('📁 '+f,f)));fs.value=lib.folders.includes(cur)?cur:lib.folders[0];let list=$('savedList');list.innerHTML='';let items=lib.scripts.filter(s=>s.folder===fs.value);if(!items.length){list.innerHTML='<div class="emptyLib">No hay guiones guardados en esta carpeta.</div>';return}items.forEach(s=>{let r=document.createElement('div');r.className='savedItem';r.innerHTML='<div class="savedMain"><div class="savedTitle"></div><div class="savedMeta">Guion guardado</div></div>';r.querySelector('.savedTitle').textContent=s.name;let o=document.createElement('button');o.textContent='Abrir';o.onclick=()=>{$('script').value=s.text;$('libraryText').value=s.text;$('scriptName').value=s.name;sync()};let d=document.createElement('button');d.textContent='Borrar';d.onclick=()=>{if(confirm('¿Borrar guion?')){lib.scripts=lib.scripts.filter(x=>x.id!==s.id);persist()}};r.append(o,d);list.append(r)})}$('folderSelect').onchange=render;$('newFolder').onclick=()=>{let n=prompt('Nombre de la carpeta');if(n&&!lib.folders.includes(n.trim())){lib.folders.push(n.trim());persist();$('folderSelect').value=n.trim();render()}};$('saveScript').onclick=()=>{let name=$('scriptName').value.trim(),text=$('libraryText').value.trim();if(!name){$('status').textContent='Pon un título al guion.';return}if(!text){$('status').textContent='Escribe el contenido del guion antes de guardarlo.';return}let folder=$('folderSelect').value,ex=lib.scripts.find(s=>s.name===name&&s.folder===folder);if(ex)ex.text=text;else lib.scripts.push({id:String(Date.now()),folder,name,text});$('script').value=text;persist();sync();$('status').textContent='Guion guardado y cargado en el teleprompter.'};function sync(){prompt.textContent=$('script').value;prompt.style.fontSize=$('font').value+'px';prompt.style.top=$('pos').value+'%';guide.style.top=$('pos').value+'%';$('sv').textContent=$('speed').value;$('fv').textContent=$('font').value+'px';$('pv').textContent=$('pos').value+'%'}['script','speed','font','pos'].forEach(x=>$(x).oninput=sync);sync();load();async function camera(){try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:true});cam.srcObject=stream;await cam.play();$('camera').textContent='✓ Cámara'}catch{$('status').textContent='Revisa permisos de cámara y micrófono.'}}$('camera').onclick=$('activate').onclick=camera;$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';if(stream)await camera()};$('mirror').onclick=()=>{mirrored=!mirrored;cam.classList.toggle('mirror',mirrored)};function frame(t){if(!scrolling)return;if(last){y+=(t-last)/1000*+$('speed').value;prompt.style.transform=`translateY(-${y}px)`}last=t;raf=requestAnimationFrame(frame)}function startScroll(){scrolling=true;last=0;raf=requestAnimationFrame(frame)}function stopScroll(){scrolling=false;cancelAnimationFrame(raf)}function reset(){stopScroll();y=0;prompt.style.transform='none'}$('scroll').onclick=()=>scrolling?stopScroll():startScroll();$('reset').onclick=reset;function ui(){document.body.classList.toggle('recordingMode',recording);$('badge').classList.toggle('on',recording);$('record').classList.toggle('stop',recording);$('pause').classList.toggle('on',recording);$('state').textContent=paused?'Ⅱ PAUSA':'● REC'}function begin(){if(!stream)return;chunks=[];elapsed=0;segment=Date.now();let type=['video/mp4','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';rec=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=finish;rec.start(500);recording=true;paused=false;ui();startScroll();tick=setInterval(()=>{let s=Math.floor((elapsed+(!paused?Date.now()-segment:0))/1000);$('timer').textContent='00:'+String(s).padStart(2,'0')},250)}function finish(){recording=false;clearInterval(tick);stopScroll();ui();blob=new Blob(chunks,{type:rec.mimeType});url=URL.createObjectURL(blob);$('playback').src=url;$('open').href=url;$('result').classList.add('on');$('result').scrollIntoView({behavior:'smooth'})}$('record').onclick=()=>{if(recording){rec.stop();return}if(!stream){camera();return}begin()};$('pause').onclick=()=>{if(rec.state==='recording'){rec.pause();elapsed+=Date.now()-segment;paused=true;stopScroll()}else{rec.resume();segment=Date.now();paused=false;startScroll()}ui()};$('save').onclick=async()=>{let ext=blob.type.includes('mp4')?'mp4':'webm',file=new File([blob],'teleprompter-video.'+ext,{type:blob.type});if(navigator.share&&navigator.canShare?.({files:[file]}))try{return await navigator.share({files:[file]})}catch{}window.open(url,'_blank')};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();</script></body></html>
